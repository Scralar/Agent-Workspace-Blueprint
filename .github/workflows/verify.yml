name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Links
        run: node blueprint/templates/scripts/check-links.mjs
      - name: British English
        run: node blueprint/templates/scripts/check-en-gb.mjs
      - name: No em or en dashes
        run: node blueprint/templates/scripts/check-punctuation.mjs

  templates:
    name: Template tests and workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Script, hook and workflow contract tests
        run: node --test blueprint/templates/*/*.test.mjs
      - name: Install actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - name: Lint workflows and workflow templates
        run: ./actionlint -color .github/workflows/*.yml blueprint/templates/workflows/*.yml
