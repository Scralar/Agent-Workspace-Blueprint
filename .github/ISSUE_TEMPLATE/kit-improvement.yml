name: Kit improvement
description: A change to blueprint/, extras, or the published process
title: "[kit] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong
      description: No personal preferences or private repo names.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would change
      description: Point at a path under blueprint/ or docs/ if you can.
    validations:
      required: false
